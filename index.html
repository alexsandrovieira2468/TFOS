  window.applyPatch=function(i){const p=safeArray('patches')[i];if(!p)return;const installed=appEntry(p.target),replacement=p.replacementApp;const replacementParsed=replacement?parseManifest(replacement,'APP',(replacement.name||installed?.name||'app')+'.app'):null;const valid=Boolean(installed&&replacement&&replacementParsed.id===installed.id&&replacementParsed.architecture===installed.architecture&&replacementParsed.runnable);if(!valid){openModal('🩹 .PATCH — não aplicado',`<p><b>${esc(p.name)}</b> foi inspecionado e permanece sem aplicação.</p><p class="muted">Alvo: ${esc(p.target||'não informado')}. A substituição precisa ter o mesmo ID e a mesma arquitetura do app instalado, além de código de entrada válido. Operações genéricas no núcleo não são executadas.</p><pre>${esc(JSON.stringify(p.operations||[],null,2))}</pre><button onclick="openPatches()">Voltar</button>`);return;}if(!confirm('Atualizar '+installed.name+' de '+installed.version+' para '+(replacement.version||'nova versão')+'? A versão anterior será registrada para diagnóstico.'))return;(async()=>{try{state.appPackageHistory=Array.isArray(state.appPackageHistory)?state.appPackageHistory:[];state.appPackageHistory.push({...installed,savedAt:new Date().toISOString()});const blob=new Blob([JSON.stringify(replacement,null,2)],{type:'application/json'});const stored=await tfosStoreBlob(blob,{name:installed.name+'.app',type:'application/x-tfos-app',source:'Atualização segura via .PATCH',architecture:installed.architecture,alsoDownload:false});const rp=parseManifest(replacement,'APP',installed.name+'.app');Object.assign(installed,{version:rp.version,manifest:rp.manifest,source:rp.source,runnable:true,launchable:true,window:rp.window,fileId:stored.id,status:'atualizado por .PATCH de app',updatedAt:new Date().toISOString()});if(state.appMeta)state.appMeta[installed.id]={...rp.manifest,id:installed.id,name:installed.name,version:rp.version,architecture:installed.architecture,window:rp.window};p.status='aplicado ao app '+installed.name+' em '+new Date().toISOString();save();notify('.PATCH aplicado somente ao app '+installed.name);openPatches()}catch(e){showToast('Falha ao aplicar patch: '+e.message)}})()};
  window.openPatches=function(){const items=safeArray('patches');openModal('🩹 Gerenciador de .PATCH',`<p class="muted">O .PATCH só será aplicado automaticamente quando trouxer uma substituição completa de um app instalado, com o mesmo ID e código de entrada válido. Patches genéricos de Launcher/Configurações/núcleo ficam apenas registrados até existir executor seguro.</p><div class="app-toolbar"><button class="primary" onclick="createPackage('PATCH')">Criar manifesto .PATCH</button><label class="btn" style="cursor:pointer">Importar .PATCH<input type="file" accept=".patch,.json" hidden onchange="registerPatch(this.files[0])"></label><button onclick="openPackageInstaller()">Instalador</button></div><div class="list">${items.map((p,i)=>`<div class="item split"><span><b>${esc(p.name)}</b><small class="muted">Alvo: ${esc(p.target)} · ${esc(p.status||'validado')}</small></span><button onclick="applyPatch(${i})">${String(p.status||'').startsWith('atualização')?'Aplicar':'Inspecionar'}</button></div>`).join('')||'<div class="empty-state">Nenhum .PATCH registrado.</div>'}</div>`)};
  window.openPacks=function(){const packs=safeArray('packs');openModal('📦 Gerenciador de .PACK',`<p class="muted">O .PACK é registrado e validado como pacote; descompactação e instalação dos componentes internos ainda não estão implementadas. Não indicamos como instalado um conteúdo que não foi extraído.</p><div class="app-toolbar"><button class="primary" onclick="createPackage('PACK')">Criar .PACK</button><label class="btn" style="cursor:pointer">Importar .PACK<input type="file" accept=".pack,.json" hidden onchange="registerPack(this.files[0])"></label><button onclick="openPackageInstaller()">Instalador</button></div><div class="list">${packs.map(p=>`<div class="item"><b>${esc(p.name)}</b><small class="muted">${esc(p.version)} · ${esc(p.architecture)} · ${esc(p.status||'registrado')}</small></div>`).join('')||'<div class="empty-state">Nenhum .PACK registrado.</div>'}</div>`)};
  window.openConnectorHub=function(sourceApp){
    const visible=(typeof tfosAppRegistry==='function'?tfosAppRegistry().filter(a=>!a.system):[]);
    const installed=safeArray('appPackages').filter(p=>p.launchable).map(p=>({name:p.name,id:'installed:'+p.id,system:false}));
    const apps=[...visible,...installed];const unique=[...new Map(apps.map(a=>[a.name,a])).values()];
    const current=sourceApp||window.__tfosConnectorSource||window.__tfosCurrentWindow||'Aplicativo';
    const services=[['package-installer','Instalador de Pacotes'],['storage-service','Serviço de Armazenamento'],['media-service','Serviço de Mídia'],['package-validator','Validador de Pacotes'],['event-service','Serviço de Eventos'],['system-diagnostics','Diagnóstico do Sistema']];
    const plugins=safeArray('plugins'),conns=safeArray('connections');
    const appOptions=unique.map(a=>`<option value="${esc(a.name)}" ${a.name===current?'selected':''}>${esc(a.name)}</option>`).join('')+(!unique.some(a=>a.name===current)?`<option value="${esc(current)}" selected>${esc(current)}</option>`:'');
    const pluginOptions=plugins.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.id)}</option>`).join('')||'<option value="">Nenhum plugin registrado</option>';
    const serviceOptions=services.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('');
    const serviceName=id=>(services.find(x=>x[0]===id)||[id,id])[1];
    openModal('🔗 TFOS Connector Hub',`<p class="muted">Todo app pode solicitar plugins e serviços por conectores. Esta página registra ligações e oferece rotas para serviços internos; plugins externos ficam como metadados até existir um runtime de plugins autorizado.</p><div class="panel"><label>App que solicita a conexão</label><select id="connectorAppTarget" style="width:100%">${appOptions}</select><div class="row" style="margin-top:12px;align-items:end"><div style="flex:1;min-width:220px"><label>Plugin .PLUGIN</label><select id="connectorPluginTarget" style="width:100%">${pluginOptions}</select></div><button class="primary" onclick="connectPluginToApp()" ${plugins.length?'':'disabled'}>Conectar plugin</button></div><div class="row" style="margin-top:10px;align-items:end"><div style="flex:1;min-width:220px"><label>Serviço oculto</label><select id="connectorServiceTarget" style="width:100%">${serviceOptions}</select></div><button class="primary" onclick="connectServiceToApp()">Conectar serviço</button></div></div><h3>Conexões registradas</h3><div class="list">${conns.length?conns.map((c,i)=>{const label=c.serviceId?serviceName(c.serviceId):(plugins.find(p=>p.id===c.pluginId)?.name||c.pluginId||'Alvo desconhecido');return `<div class="item split"><span><b>${esc(c.appName)}</b><small class="muted">${esc(label)} · ${c.enabled?'conectado':'desconectado'} · ${c.kind||'plugin'}</small></span><div class="row"><button onclick="toggleTFOSConnection(${i})">${c.enabled?'Desconectar':'Conectar'}</button><button class="danger" onclick="removeTFOSConnection(${i})">Remover</button></div></div>`}).join(''):'<div class="empty-state">Nenhuma conexão registrada.</div>'}</div><h3>Rotas de serviço</h3><div class="tool-grid2">${services.map(x=>`<button onclick="openTFOSService('${x[0]}')">${x[1]}</button>`).join('')}</div><p class="muted">Exemplos de plugins: conversor de unidades, fórmulas financeiras e solucionador de equações. A ligação fica registrada; a execução de plugins importados ainda exige um runtime específico.</p>`);
  };
  window.connectPluginToApp=function(){const app=document.getElementById('connectorAppTarget')?.value,pid=document.getElementById('connectorPluginTarget')?.value;if(!app||!pid)return showToast('Selecione app e plugin.');const conns=safeArray('connections');const old=conns.find(c=>c.appName===app&&c.pluginId===pid);if(old)old.enabled=true;else conns.push({appName:app,pluginId:pid,kind:'plugin',enabled:true,createdAt:new Date().toISOString()});save();notify('Conector registrado: '+app+' ↔ '+pid);openConnectorHub(app)};
  window.connectServiceToApp=function(){const app=document.getElementById('connectorAppTarget')?.value,serviceId=document.getElementById('connectorServiceTarget')?.value;if(!app||!serviceId)return showToast('Selecione app e serviço.');const conns=safeArray('connections');const old=conns.find(c=>c.appName===app&&c.serviceId===serviceId);if(old)old.enabled=true;else conns.push({appName:app,serviceId,kind:'service',enabled:true,createdAt:new Date().toISOString()});save();notify('Conector de serviço registrado: '+app+' ↔ '+serviceId);openConnectorHub(app)};
  window.toggleTFOSConnection=function(i){const c=state.connections?.[i];if(!c)return;c.enabled=!c.enabled;save();openConnectorHub(c.appName)};
  window.removeTFOSConnection=function(i){if(!state.connections?.[i])return;if(!confirm('Remover esta conexão?'))return;state.connections.splice(i,1);save();openConnectorHub()};
  window.openSystemServices=function(){
    const items=[['package-installer','📦 Instalador de Pacotes','Valida manifestos e registra .app/.plugin/.pack; executa apps aptos em sandbox.','Parcial: não aplica patch genérico do núcleo.'],['storage-service','💽 Armazenamento TFOS','Índice de arquivos em IndexedDB; áreas lógicas TFOS32/TFOS64.','Supabase remoto não consultado nesta cópia.'],['connector-hub','🔗 Connector Hub','Registra relações entre apps e plugins.','Metadados de conexão; runtime de plugins ainda não executa código.'],['media-service','🎞️ Serviço de Mídia','Reproduz áudio/vídeo suportado pelo navegador e visualiza PDFs/imagens.','Usa APIs do navegador.'],['package-validator','🛡️ Validador de Pacotes','Inspeciona formato e manifesto antes da confirmação.','JSON apenas; formatos binários/assinatura pendentes.'],['event-service','⚡ Serviço de Eventos','Exibe notificações e eventos locais.','Histórico local.'],['system-diagnostics','🩺 Diagnóstico do Sistema','Mede índice local, metadados e conexão configurada.','Não finge medir a cota Supabase.']];
    openModal('⚙️ Serviços do TFOS',`<p class="muted">Serviços ocultos têm páginas próprias e funções identificadas. Estados parciais aparecem explicitamente, sem chamar um registro de serviço completo.</p><div class="service-list">${items.map(x=>`<div class="service"><span><b>${x[1]}</b><small class="muted" style="display:block">${x[2]}</small><small class="muted">${x[3]}</small></span><button onclick="openTFOSService('${x[0]}')">Abrir página</button></div>`).join('')}</div><div class="app-toolbar"><button onclick="openPluginManager()">Plugins</button><button onclick="openConnectorHub()">Conectores</button><button onclick="openPackageInstaller()">Instalador</button></div>`);
  };
  window.openTFOSService=function(id){const routes={'package-installer':()=>openPackageInstaller(),'package-validator':()=>openPackageInstaller(),'storage-service':()=>openStorageService(),'connector-hub':()=>openConnectorHub(),'media-service':()=>openMediaPlayer(),'event-service':()=>openEventService(),'system-diagnostics':()=>openSystemDiagnostics(),'files':()=>openTFOSFileManager(),'plugins':()=>openPluginManager(),'services':()=>openSystemServices(),'packages-app':()=>openAppPackages(),'packages-patch':()=>openPatches(),'packages-pack':()=>openPacks()};if(routes[id])return routes[id]();showToast('Serviço sem rota.');};
  window.openSystemManager=function(){openModal('🛠️ Painel do sistema',`<div class="tool-grid2"><button onclick="openTasks()">Tarefas</button><button onclick="openSystemServices()">Serviços</button><button onclick="openConnectorHub()">Conectores</button><button onclick="openPluginManager()">Plugins</button><button onclick="openExternalFileManager()">Gerenciador externo</button><button onclick="openPackageInstaller()">Instalador de Pacotes</button><button onclick="openAppPackages()">.APP</button><button onclick="openPatches()">.PATCH</button><button onclick="openPacks()">.PACK</button><button onclick="openBackupRestore()">Backup / Restore</button><button onclick="openSystemDiagnostics()">Diagnóstico</button></div>`)};
  window.openStorageService=function(){const a=state.storageBuckets?.TFOS32||{apps:{},files:[]},b=state.storageBuckets?.TFOS64||{apps:{},files:[]};const aBytes=(state.files||[]).filter(f=>f.architecture==='TFOS32').reduce((n,f)=>n+Number(f.size||0),0),bBytes=(state.files||[]).filter(f=>f.architecture==='TFOS64').reduce((n,f)=>n+Number(f.size||0),0),info=tfosStorageInfo();openModal('💽 Serviço de Armazenamento',`<p class="muted">O serviço de arquivos usa IndexedDB local, mais um índice no estado local. TFOS32/TFOS64 são áreas lógicas. Esta cópia não consulta a API Storage do Supabase, então não há número apresentado como uso remoto real.</p><div class="two"><div class="card"><h3>TFOS32</h3><p>Apps leves e dados compatíveis.</p><div class="big">${tfosFormatBytes(aBytes)}</div><small>${(a.files||[]).length} itens indexados</small></div><div class="card"><h3>TFOS64</h3><p>Apps e dados de maior consumo.</p><div class="big">${tfosFormatBytes(bBytes)}</div><small>${(b.files||[]).length} itens indexados</small></div></div><div class="settings-row"><b>Metadados serializados</b><span>${tfosFormatBytes(info.used)}</span></div><div class="settings-row"><b>Arquivos indexados no armazenamento local</b><span>${tfosFormatBytes(aBytes+bBytes)}</span></div><div class="settings-row"><b>Referência de quota Supabase</b><span>500 MB · uso remoto desconhecido</span></div><div class="settings-row"><b>Configuração detectada</b><span>${esc(tfosSupabaseStatus())}</span></div><p class="muted">O HTML hospedeiro (~1,6 MB) só conta para uma quota Supabase se estiver de fato no bucket contabilizado; não é somado artificialmente à ocupação local.</p><button class="primary" onclick="openExternalFileManager()">Conectar gerenciador externo</button>`)};
  window.openSystemDiagnostics=function(){const info=tfosStorageInfo(),localFiles=(state.files||[]).reduce((n,f)=>n+Number(f.size||0),0),rows=[['Metadados localStorage',tfosFormatBytes(info.used)],['Arquivos no índice',String((state.files||[]).length)],['Bytes indexados em IndexedDB',tfosFormatBytes(localFiles)],['Apps instalados e inicializáveis',String(safeArray('appPackages').filter(p=>p.launchable).length)],['Manifestos .APP',String(safeArray('appPackages').length)],['Plugins',String(safeArray('plugins').length)],['Conexões',String(safeArray('connections').length)],['.PATCH',String(safeArray('patches').length)],['.PACK',String(safeArray('packs').length)],['Supabase',tfosSupabaseStatus()]];openModal('🩺 Diagnóstico do Sistema',`<div class="list">${rows.map(r=>`<div class="item split"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div><div class="app-toolbar"><button onclick="openSystemServices()">Serviços</button><button onclick="openConnectorHub()">Conectores</button><button onclick="openExternalFileManager()">Gerenciador externo</button></div>`)};
  window.openEventService=function(){const ev=[...(state.events||[]),...(state.notifications||[]).slice(-50).map(message=>({message}))];openModal('⚡ Serviço de Eventos',`<p class="muted">Eventos e notificações persistidos localmente.</p><div class="list">${ev.slice(-100).reverse().map(e=>`<div class="item">${esc(typeof e==='string'?e:(e.message||e.name||JSON.stringify(e)))}</div>`).join('')||'<div class="empty-state">Nenhum evento registrado.</div>'}</div>`)};
  window.openMediaService=function(){openMediaPlayer()};
  window.tfosStorageInfo=function(){const metadataBytes=new Blob([JSON.stringify(state)]).size,indexedBytes=(state.files||[]).reduce((n,f)=>n+Number(f.size||0),0);return {used:metadataBytes,metadataBytes,indexedBytes,scope:'metadados localStorage + índice de arquivos em IndexedDB'}};
  // Development-created .APP packages are stored internally rather than exported by default.
  window.devBuildApp=async function(){
    const name=document.getElementById('appName')?.value.trim()||'meu-app';
    const id=document.getElementById('appId')?.value.trim()||'br.tfos.'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    const ver=document.getElementById('appVer')?.value.trim()||'1.0.0';
    const code=document.getElementById('devCode')?.value||'';
    const script=document.getElementById('devScriptName')?.value||'main.js';
    const lang=document.getElementById('devLang')?.value||'JavaScript';
    const architecture=normArch(document.getElementById('appArchitecture')?.value||'TFOS32');
    const mode=fmtMode(document.getElementById('appWindowMode')?.value||'resizable');
    const width=Math.max(320,Math.min(1600,Number(document.getElementById('appWindowWidth')?.value)||760));
    const height=Math.max(220,Math.min(1200,Number(document.getElementById('appWindowHeight')?.value)||560));
    const files=(window.__tfosDevFiles||[]).map(f=>({name:f.name,type:f.type,size:f.size}));
    const data={format:'TFOS-APP',type:'APP',version:ver,name,id,createdAt:new Date().toISOString(),manifest:{id,name,version:ver,architecture,window:{mode,preferredWidth:width,preferredHeight:height},entry:script,defaultRoles:[],capabilities:[]},source:{language:lang,entry:script,code},files};
    const file=new File([JSON.stringify(data,null,2)],name+'.app',{type:'application/x-tfos-app'});
    if(code.length>350000)showToast('Aviso: código acima de 350 KB será registrado sem runtime nesta versão.');
    openPackageInstaller();await window.tfosInspectPackageFile(file,'APP');
  };
  // File-manager view and route-aware package actions remain inside TFOS by default.
  window.openModal=(function(base){return function(title,html){if(!window.__tfosWMOpening&&window.tfosWM&&window.tfosWM?.active){const w=window.tfosWM.wins.get(window.tfosWM.active);if(w&&!w.closed&&w.el){w.navHistory=w.navHistory||[];w.navHistory.push({title:w.title,html:w.el.querySelector('.tfosWMBody')?.innerHTML||''});w.title=title;const t=w.el.querySelector('.tfosWMTitle');if(t)t.textContent=String(title).replace(/^[^ ]+ /,'');const b=w.el.querySelector('.tfosWMBody');if(b)b.innerHTML=html;w.html=html;return;}}return base(title,html)}})(window.openModal);
  window.closeModal=(function(base){return function(){if(!window.__tfosWMOpening&&window.tfosWM?.active){const w=window.tfosWM.wins.get(window.tfosWM.active);if(w&&!w.closed){if(w.navHistory?.length){const prev=w.navHistory.pop();w.title=prev.title;const t=w.el.querySelector('.tfosWMTitle');if(t)t.textContent=String(prev.title).replace(/^[^ ]+ /,'');const b=w.el.querySelector('.tfosWMBody');if(b)b.innerHTML=prev.html;return;}if(window.tfosWM){window.tfosWM.minimize(w.type);return;}}}return base()}})(window.closeModal);
  // Navigation map and common service pages; hidden services are not forced into the user launcher.
  window.openAppByName=window.openAppByName||function(name){showToast(name+' sem rota')};
  window.renderLauncherMenu=window.renderLauncherMenu; // Uses the dynamic launcherEntries above.
  // .plugin was removed; compatibility records are ignored, all new tooling uses .plugin.
  try{if(state.legacyGeral)delete state.legacyGeral;save()}catch(e){}
})();
</script>
