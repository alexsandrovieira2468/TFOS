.desktop-icon .ico{font-size:34px;line-height:1}
.desktop-icon small{font-size:12px;line-height:1.15;text-shadow:0 2px 5px #000}.desktop-icon .remove-desktop{position:absolute;right:4px;top:4px;display:none;font-size:11px;padding:3px 5px;border-radius:7px}.desktop-icon:hover .remove-desktop{display:block}.desktop-info{position:absolute;right:22px;bottom:18px;color:#ffffff88;font-size:12px;z-index:2}
.tfosDock{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:4px;min-height:54px;padding:5px 7px;border:1px solid rgba(255,255,255,.11);border-radius:17px;background:rgba(9,14,20,.30);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);box-shadow:0 8px 24px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.07);max-width:min(92vw,760px);overflow-x:auto;scrollbar-width:none}.tfosDock::-webkit-scrollbar{display:none}.tfosDockItem{width:44px;height:44px;flex:0 0 44px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);border-radius:12px;display:grid;place-items:center;padding:0;position:relative;font-size:24px;box-shadow:none;transition:.14s}.tfosDockItem:hover{transform:translateY(-4px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18)}.tfosDockItem small{position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);background:rgba(8,12,17,.92);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 6px;font-size:9px;white-space:nowrap;opacity:0;pointer-events:none}.tfosDockItem:hover small{opacity:1}.tfosDockEmpty{display:none}
#tfosNativeMenu{position:fixed;top:50px;left:12px;width:min(470px,calc(100vw - 24px));max-height:min(520px,calc(100vh - 64px));overflow:hidden;z-index:99999;padding:0;background:rgba(15,21,29,.72);border:1px solid rgba(255,255,255,.13);border-radius:15px;box-shadow:0 18px 48px rgba(0,0,0,.30),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(24px) saturate(125%);-webkit-backdrop-filter:blur(24px) saturate(125%);display:none}.launcherMenuHead{padding:10px 11px 9px;border-bottom:1px solid rgba(255,255,255,.08)}.launcherMenuSearch{background:rgba(4,8,13,.45)!important;border-color:rgba(255,255,255,.11)!important;border-radius:9px!important;height:34px!important}.launcherMenuBody{display:block;min-height:0;overflow:auto}.launcherMenuApps{padding:10px 11px 12px;overflow:visible}.launcherMenuTitle{display:flex;justify-content:space-between;align-items:center;margin:0 1px 8px}.launcherMenuGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.launcherMenuCard{position:relative;min-height:76px;text-align:center;background:rgba(255,255,255,.025);border:1px solid transparent;border-radius:10px;padding:8px 5px 6px}.launcherMenuCard:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.10)}.launcherMenuCard .mi{font-size:27px;display:block;margin:2px 0 5px}.launcherMenuCard b{display:block;font-size:10px;line-height:1.15;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.launcherMenuHint{font-size:9px;color:#9ba5b1;margin:0}.launcherMenuActions{display:none}.launcherMenuClose{border:0;background:transparent!important;font-size:16px!important;padding:3px 6px!important}.launcherMenuCats{display:none}.launcherAppMore{position:absolute;right:4px;top:4px;width:23px;height:23px;padding:0;border:0;border-radius:7px;background:transparent;color:#b8c1cb;font-size:15px;line-height:1;opacity:.65}.launcherMenuCard:hover .launcherAppMore{opacity:1;background:rgba(255,255,255,.08)}.launcherAppMore:hover{background:rgba(255,255,25 .screen{height:100%;max-width:none;margin:0}
.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}
h1{font-size:28px;margin:0 0 5px}h2{margin:0 0 12px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:#121820ee;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 8px 30px #0003}
.card h3{margin:0 0 7px}.big{font-size:27px;font-weight:800}
.tag{display:inline-flex;gap:5px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.app{min-height:125px;text-align:left;background:linear-gradient(145deg,#17202a,#11161d);border:1px solid var(--line);border-radius:15px;padding:16px}
.app .ico{font-size:31px;display:block;margin-bottom:13px}.app strong{display:block}.app small{color:var(--muted)}
.panel{background:#111820ee;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.split{display:flex;justify-content:space-between;gap:12px;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}.item{padding:11px;border:1px solid var(--line);border-radius:11px;background:#0e141bdd}.item .right{margin-left:auto}
#dock{position:fixed;right:12px;top:6px;display:flex;gap:5px;z-index:30}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:100}
.modal.open{display:flex}
.window{width:min(940px,94vw);max-height:88vh;background:#10161ddd;border:1px solid #45515f;border-radius:15px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(20px)}
.winbar{height:44px;padding:0 9px;display:flex;align-items:center;gap:7px;background:#1a2129ee;border-bottom:1px solid var(--line)}
.winbar strong{flex:1}.win-actions{display:flex;align-items:center;gap:6px}.win-back,.close{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:10px}.win-back{background:#17222d;border-color:#334352;color:var(--txt);font-size:19px;line-height:1}.win-back[hidden]{display:none}.win-back:hover{background:#22313f}.close{background:#351a20;border-color:#67303a}
.winbody{padding:16px;overflow:auto}

.cmdline{display:flex;gap:8px}.cmdline input{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.progress{height:7px;background:#0a1017;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}

/* ===== TFOS V3 ===== */
.store-shell{max-width:1180px;margin:auto;padding:0 0 42px;min-height:max-content}
.store-hero{
  min-height:205px;border:1px solid #ffffff16;border-radius:22px;padding:26px;

.store-section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}

.store-card .version{color:#75818e;font-size:11px}.store-card .install{padding:6px 12px;border-radius:999px}

.notes-status{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.gallery-toolbar .spacer{flex:1}
.view-toggle button.active{background:#2d73c8;border-color:#69a7eb}

  border:1px dashed #536274;border-radius:15px;padding:18px;text-align:center;color:#9aa7b4;
  margin-bottom:13px;background:#0d141b99
}
.gallery-drop.drag{border-color:#72a7ff;background:#1c3550}

 .store-hero{min-height:230px;padding:20px}.store-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

<body>

</div>

    <div class="winbar"><strong id="winTitle">TFOS</strong><div class="win-actions"><button id="winHome" onclick="tfosWindowBack()" title="Voltar ao TFOS">← Voltar</button><button id="winBack" class="win-back" onclick="goBackModal()" title="Página anterior" aria-label="Página anterior" hidden>↶</button><button id="winConnect" onclick="openConnectorsForCurrentApp()" title="Conectar plugins e serviços">🔗 Conectores</button><button id="winExpand" onclick="toggleModalFullscreen()" title="Ampliar para a tela TFOS">⛶</button><button onclick="closeModal()" class="close" title="Fechar">✕</button></div></div>
    <div id="winBody" class="winbody"></div>
  </section>
</div>
<div id="toast" class="toast"></div>
<script>
const KEY='TFOS_LAB_STATE_V3_3'; const PREVIOUS_KEY='TFOS_LAB_STATE_V3_2'; const PREVIOUS_KEY2='TFOS_LAB_STATE_V3'; const OLD_KEY='TFOS_LAB_STATE_V2'; const OLDER_KEY='TFOS_LAB_STATE_V1';
let state=JSON.parse(localStorage.getItem(KEY)||'null');
if(!state){try{state=JSON.parse(localStorage.getItem(PREVIOUS_KEY)||'null')}catch(e){}}
if(!state){try{state=JSON.parse(localStorage.getItem(PREVIOUS_KEY2)||'null')}catch(e){}}
if(!state){try{state=JSON.parse(localStorage.getItem(OLD_KEY)||'null')}catch(e){}}
if(!state){try{state=JSON.parse(localStorage.getItem(OLDER_KEY)||'null')}catch(e){}}
state=state||{notes:'',theme:'dark',apps:[],tasks:[],files:[],wallpaper:true,wallpaperName:'Aurora',iconSize:34,showNames:true,grid:true,recentes:[],notifications:[],installed:[],media:[],noteTitle:'Sem título',storeCategory:'Todos',events:[],downloads:[],clipboard:[],patches:[],packs:[],vault:[],links:[],recordings:[]};

// Limpeza de migração: remove registros e atalhos do Office legado sem tocar nos dados de outros aplicativos.
try{state.apps=(Array.isArray(state.apps)?state.apps:[]).filter(n=>String(n).toLowerCase()!=='office'&&String(n).toLowerCase()!=='tfos office');state.launcherDock=(Array.isArray(state.launcherDock)?state.launcherDock:[]).filter(id=>String(id).toLowerCase()!=='office');state.desktopItems=(Array.isArray(state.desktopItems)?state.desktopItems:[]).filter(id=>String(id).toLowerCase()!=='office');if(state.appMeta){for(const k of Object.keys(state.appMeta)){const v=state.appMeta[k];if(String(k).toLowerCase()==='office'||String(v?.name||'').toLowerCase()==='office'||String(v?.name||'').toLowerCase()==='tfos office')delete state.appMeta[k];}}if(state.appData)delete state.appData.office;if(state.appCache)delete state.appCache.office;localStorage.setItem(KEY,JSON.stringify(state));}catch(e){console.warn('Limpeza do Office legado ignorada',e);}
state.launcherDock=Array.isArray(state.launcherDock)?state.launcherDock:[];
state.desktopItems=Array.isArray(state.desktopItems)?state.desktopItems:[];
try{
 const normList=a=>[...new Set((Array.isArray(a)?a:[]).map(x=>typeof tfosNormalizeLauncherId==='function'?tfosNormalizeLauncherId(x):String(x)).filter(Boolean))];
 state.launcherDock=normList(state.launcherDock);state.desktopItems=normList(state.desktopItems);
}catch(e){console.warn('Normalização de atalhos legados adiada',e)}
state.recentes=state.recentes||[];state.notifications=state.notifications||[];state.installed=state.installed||[];delete state.trash;state.plugins=Array.isArray(state.plugins)?state.plugins:[];state.connections=Array.isArray(state.connections)?state.connections:[];state.storageBuckets=state.storageBuckets||{TFOS32:{apps:{},files:[]},TFOS64:{apps:{},files:[]}};state.storageBuckets.TFOS32=state.storageBuckets.TFOS32||{apps:{},files:[]};state.storageBuckets.TFOS64=state.storageBuckets.TFOS64||{apps:{},files:[]};state.appPackages=Array.isArray(state.appPackages)?state.appPackages:[];state.windowProfiles=state.windowProfiles||{};state.apps=(state.apps||[]).filter(n=>String(n).toLowerCase()!=='lixeira');state.desktopItems=(state.desktopItems||[]).filter(n=>String(n).toLowerCase()!=='trash');state.launcherDock=(state.launcherDock||[]).filter(n=>String(n).toLowerCase()!=='trash');state.events=state.events||[];state.downloads=state.downloads||[];state.clipboard=state.clipboard||[];state.patches=state.patches||[];state.packs=state.packs||[];state.vault=state.vault||[];state.links=state.links||[];state.recordings=state.recordings||[];
state.media=state.media||[];state.projects=state.projects||[];state.printQueue=state.printQueue||[];state.noteTitle=state.noteTitle||'Sem título';state.storeCategory=state.storeCategory||'Todos';state.galleryView=state.galleryView||'grid';state.launcherDock=Array.isArray(state.launcherDock)?state.launcherDock:[];state.desktopItems=Array.isArray(state.desktopItems)?state.desktopItems:[];
state.appMeta=state.appMeta||{};state.appPackages=state.appPackages||[];state.appData=state.appData||{};state.appCache=state.appCache||{};state.defaultApps=state.defaultApps||{};state.showSystemApps=state.showSystemApps===true;

// Migration: hide the duplicate built-in file manager; preserve all stored file contents.
try{
 const duplicateNames=new Set(['gerenciador de arquivos','file manager','tfos file manager']);
 const clean=x=>!duplicateNames.has(String(x??'').toLowerCase().trim()) && !['files','file-manager'].includes(String(x??'').toLowerCase().trim());
 state.apps=(Array.isArray(state.apps)?state.apps:[]).filter(clean);
 state.launcherDock=(Array.isArray(state.launcherDock)?state.launcherDock:[]).filter(clean);
 state.desktopItems=(Array.isArray(state.desktopItems)?state.desktopItems:[]).filter(clean);
 save();
}catch(e){console.warn('Migração do gerenciador duplicado ignorada',e)}
save();
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.style.display='none',2600)}
window.__tfosModalHistory=[]; window.__tfosNavigatingBack=false; window.__tfosNavigationScope='global';
function updateModalBackButton(){const b=document.getElementById('winBack');if(b)b.hidden=!(window.__tfosModalHistory&&window.__tfosModalHistory.length);}
function goBackModal(){
  const h=window.__tfosModalHistory||[];
  if(!h.length)return;
  const prev=h.pop();
  window.__tfosNavigatingBack=true;
  document.getElementById('winTitle').textContent=prev.title;
  document.getElementById('winBody').innerHTML=prev.html;
  window.__tfosCurrentWindow=prev.title;
  updateModalBackButton();
  window.__tfosNavigatingBack=false;
}
function openModal(title,html){
  const modal=document.getElementById('modal');
  document.getElementById('winBody')?.classList.remove('settings-host');
  if(modal.classList.contains('open')&&!window.__tfosNavigatingBack&&window.__tfosCurrentWindow!==title){
    window.__tfosModalHistory=window.__tfosModalHistory||[];
    window.__tfosModalHistory.push({title:window.__tfosCurrentWindow,html:document.getElementById('winBody').innerHTML});
  }
  window.__tfosCurrentWindow=title;
  if(!state.recentes)state.recentes=[];
  state.recentes=[title,...state.recentes.filter(x=>x!==title)].slice(0,12);
  save();
  document.getElementById('winTitle').textContent=title;
  document.getElementById('winBody').innerHTML=html;
  document.getElementById('modal').classList.add('open');
  const modalWindow=document.querySelector('#modal .window');if(modalWindow){modalWindow.classList.remove('tfos-modal-fullscreen','tfos-modal-fixed');const profile=state.windowProfiles?.[title]||{};if(profile.mode==='fullscreen')modalWindow.classList.add('tfos-modal-fullscreen');if(profile.mode==='fixed'){modalWindow.style.resize='none';modalWindow.style.width=(profile.width||900)+'px';modalWindow.style.height=(profile.height||600)+'px'}else modalWindow.style.resize='both';const expand=document.getElementById('winExpand');if(expand)expand.textContent=modalWindow.classList.contains('tfos-modal-fullscreen')?'❐':'⛶'}
  updateModalBackButton();
  if(title.includes('Bloco de Notas'))setTimeout(noteLive,0);
}
function tfosWindowBack(){if(window.__tfosModalHistory&&window.__tfosModalHistory.length)return goBackModal();closeModal()}
function toggleModalFullscreen(){const w=document.querySelector('#modal .window');if(!w)return;w.classList.toggle('tfos-modal-fullscreen');const b=document.getElementById('winExpand');if(b)b.textContent=w.classList.contains('tfos-modal-fullscreen')?'❐':'⛶'}
function closeModal(){document.getElementById('modal').classList.remove('open');const wb=document.getElementById('winBody');if(wb){wb.classList.remove('settings-host');wb.innerHTML=''}window.__tfosModalHistory=[];updateModalBackButton()}
document.addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft'&&document.getElementById('modal')?.classList.contains('open')&&window.__tfosModalHistory?.length){e.preventDefault();goBackModal();}});
function setActive(el){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active')}
function home(el){
  renderDesktop();
}
function tfosNormalizeLauncherId(value){
  const raw=String(value??'').trim();
  const aliases={
    'TFOS Store':'store','Store':'store','Configurações':'settings','Settings':'settings',
    'Personalização':'personalization','Calculadora':'calculator','Calendário':'calendar',
    'Relógio':'clock','Bloco de Notas':'notes','Notas':'notes','Galeria':'gallery',
    'Ferramentas de Texto':'texttools','Ícones & Paint':'paint','Paint':'paint',
    'Gravador':'recorder','Downloads':'downloads','Downloads & Compartilhamento':'downloads',
    'Editor de Código':'code','TFOS Lab':'lab','TFOS Dev':'dev'
  };
  if(aliases[raw])return aliases[raw];
  return raw;
}
window.tfosNormalizeLauncherId=tfosNormalizeLauncherId;
function tfLauncherMeta(id){
  id=tfosNormalizeLauncherId(id);
  const m={
    store:['🏪','TFOS Store','store'],calculator:['🧮','Calculadora','calculator'],clock:['🕐','Relógio','clock'],notes:['📝','Notas','notes'],gallery:['🖼️','Galeria','gallery'],lab:['🧪','TFOS Lab','lab'],dev:['🧰','TFOS Dev','dev'],settings:['⚙️','Configurações','settings'],calendar:['📅','Calendário','calendar'],personalization:['🎨','Personalização','personalization'],texttools:['🔤','Ferramentas de Texto','texttools'],paint:['🎨','Ícones & Paint','paint'],recorder:['🎙️','Gravador','recorder'],downloads:['📥','Downloads','downloads'],code:['💻','Editor de Código','code'],
  }; return m[id]||['📦',id,id];
}
function renderDock(){
  let dock=document.getElementById('tfosDock'); if(!dock){dock=document.createElement('div');dock.id='tfosDock';dock.className='tfosDock';document.body.appendChild(dock);}
  const ids=Array.isArray(state.launcherDock)?state.launcherDock:[];
  dock.innerHTML=ids.map(id=>{const m=tfLauncherMeta(id);return `<button class="tfosDockItem" onclick="openLauncherItem('${esc(id)}')" title="${esc(m[1])}"><span>${m[0]}</span><small>${esc(m[1])}</small></button>`}).join('');
}
function renderDesktop(){
  const ids=Array.isArray(state.desktopItems)?state.desktopItems:[];
  const icons=ids.map(id=>{const m=tfLauncherMeta(id);return `<button class="desktop-icon" data-app="${esc(id)}" onclick="desktopClick('${esc(m[1])}')" ondblclick="event.preventDefault();openLauncherItem('${esc(id)}')" title="${esc(m[1])} • duplo clique"><span class="remove-desktop" role="button" onclick="event.stopPropagation();removeDesktopItem('${esc(id)}')">✕</span><span class="ico">${m[0]}</span><small>${esc(m[1])}</small></button>`}).join('');
  main.innerHTML=`<div class="desktop" id="desktop"><button class="desktop-add" onclick="tfOpenNativeMenuFromHome()">＋ Adicionar</button><div class="desktop-icons">${icons||'<div style="color:#ffffff66;font-size:11px;padding:10px">Área de trabalho livre. Use o Menu para escolher aplicativos ou pastas.</div>'}</div><div class="desktop-info">TFOS Lab 3.1.0 • área inicial personalizada • ${new Date().toLocaleDateString('pt-BR')}</div></div>`;
  renderDock();
}

function openLauncherItem(id){
  closeNativeMenu();
  /* All launcher entries go through the Window Manager, including the former special routes. */
  if(id==='store'){openApp('store');return}
  if(id==='settings'){if(window.tfosWM)return window.tfosWM.open('settings');openApp('settings');return}
   openApp(id);
}
function toggleDockItem(id){
  state.launcherDock=Array.isArray(state.launcherDock)?state.launcherDock:[];
  if(state.launcherDock.includes(id)) state.launcherDock=state.launcherDock.filter(x=>x!==id); else state.launcherDock.push(id);
  save(); renderDesktop(); renderLauncherMenu(); showToast(state.launcherDock.includes(id)?'Aplicativo colocado na base':'Aplicativo retirado da base');
}
function toggleDesktopItem(id){
  state.desktopItems=Array.isArray(state.desktopItems)?state.desktopItems:[];
  if(state.desktopItems.includes(id)) state.desktopItems=state.desktopItems.filter(x=>x!==id); else state.desktopItems.push(id);
  save(); renderDesktop(); renderLauncherMenu(); showToast(state.desktopItems.includes(id)?'Aplicativo colocado na área inicial':'Aplicativo retirado da área inicial');

function removeDesktopItem(id){state.desktopItems=(state.desktopItems||[]).filter(x=>x!==id);save();renderDesktop();renderLauncherMenu();}
function tfOpenNativeMenuFromHome(){openNativeMenu();}

function desktopClick(name){

// Roteador de segurança do launcher: garante duplo clique mesmo se um ícone for recriado dinamicamente.
document.addEventListener('dblclick',function(ev){

  if(!icon)return;
  const action=icon.getAttribute('data-tfos-action');
  if(action){ev.preventDefault();ev.stopPropagation();try{new Function(action)()}catch(e){console.error(e);}}
},true);
function openTopMenu(name){

function calcSet(v){document.getElementById('calc').value=v;calcRun()}
function calcKey(k){const e=document.getElementById('calc');if(!e)return;if(k==='C'){e.value='';document.getElementById('calcOut').textContent='Digite uma conta.';return}if(k==='⌫'){e.value=e.value.slice(0,-1);e.focus();return}const map={'÷':'/','×':'*','−':'-'};e.value+=(map[k]||k);e.focus()}
function calcRun(){let v=document.getElementById('calc')?.value.trim()||'';let out=document.getElementById('calcOut');if(!out)return;try{if(/^\s*\d+(\.\d+)?%\s*de/i.test(v)){let m=v.match(/([\d.]+)%\s*de\s*([\d.]+)/i);if(!m)throw Error();out.textContent=(parseFloat(m[1])*parseFloat(m[2])/100).toString()}else if(/km em milhas/i.test(v)){let n=parseFloat(v);if(!Number.isFinite(n))throw Error();out.textContent=(n*0.621371).toFixed(3)+' milhas'}else{let expr=v.replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[^0-9+\-*/().%\s]/g,'').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if(!expr.trim())throw Error();let result=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(result))throw Error();out.textContent=String(Number(result.toPrecision(12)))}}catch(e){out.textContent='Expressão inválida. Confira os números e operadores.'}}
let sw=0,swTimer=null;function toggleStopwatch(){if(swTimer){clearInterval(swTimer);swTimer=null}else{let t=Date.now()-sw;swTimer=setInterval(()=>{sw=Date.now()-t;document.getElementById('stopwatch').textContent=new Date(sw).toISOString().substr(14,5)},100)}}
function clockTick(){let n=()=>{let d=new Date();let a=document.getElementById('clockNow'),b=document.getElementById('dateNow');if(a)a.textContent=d.toLocaleTimeString('pt-BR');if(b)b.textContent=d.toLocaleDateString('pt-BR')};n();setInterval(n,1000)}
function noteLive(){const t=document.getElementById('notes')?.value||'';const words=(t.trim().match(/\S+/g)||[]).length;const lines=t? t.split(/\r?\n/).length:0;const a=document.getElementById('noteCount'),b=document.getElementById('noteLines');if(a)a.textContent=words+' palavras';if(b)b.textContent=lines+' linhas';}

function noteAction(a){
 const e=document.getElementById('notes');if(!e)return;let t=e.value;
 if(a==='bold'){e.value='**'+t+'**'}
 if(a==='upper')e.value=t.toUpperCase();
 if(a==='lower')e.value=t.toLowerCase();
 if(a==='trim')e.value=t.split(/\r?\n/).map(x=>x.trim()).join('\n');
 if(a==='spaces')e.value=t.replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n');
 if(a==='lines')showToast('Linhas: '+(t?t.split(/\r?\n/).length:0));
 if(a==='words')showToast('Palavras: '+(t.trim().match(/\S+/g)||[]).length);
 if(a==='sort')e.value=t.split(/\r?\n/).sort((a,b)=>a.localeCompare(b,'pt-BR')).join('\n');
 if(a==='dedupe')e.value=[...new Set(t.split(/\r?\n/))].join('\n');
 if(a==='reverse')e.value=t.split(/\r?\n/).reverse().join('\n');
 if(a==='date')e.value=t+(t?'\\n\\n':'')+new Date().toLocaleString('pt-BR');
 if(a==='copy')navigator.clipboard?.writeText(t).then(()=>showToast('Texto copiado')).catch(()=>showToast('Copie manualmente'));
 if(a==='download'||a==='md'){let blob=new Blob([t],{type:'text/plain;charset=utf-8'}),ael=document.createElement('a');ael.href=URL.createObjectURL(blob);ael.download=(state.noteTitle||'nota')+(a==='md'?'.md':'.txt');ael.click();URL.revokeObjectURL(ael.href);showToast('Arquivo gerado')}
 noteLive();state.notes=e.value;save();
}

function startTask(name,detail,autoFinish){
  let id=crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
  state.tasks.push({id,name,detail,progress:0,startedAt:Date.now()});
  save();updateBadge();notify(name+' iniciado');
  if(autoFinish){
    let timer=setInterval(()=>{
      let t=state.tasks.find(x=>x.id===id);
      if(!t){clearInterval(timer);return}
      t.progress+=Math.floor(Math.random()*18)+8;
      if(t.progress>=100){
        t.progress=100;clearInterval(timer);
        setTimeout(()=>{
          state.tasks=state.tasks.filter(x=>x.id!==id);save();updateBadge();
          notify(name+' concluído');
          if(document.getElementById('taskList'))renderTasks();
        },700);
      }
      save();updateBadge();
      if(document.getElementById('taskList'))renderTasks();
    },700);
  }
}

function bindSettingsScroll(){
 const side=document.querySelector('.settings-side'), page=document.querySelector('.settings-page');
 [side,page].forEach(el=>{
   if(!el)return;
   if(el.dataset.wheelBound){el.scrollTop=el.scrollTop;return;}
   el.dataset.wheelBound='1';
   el.addEventListener('wheel',e=>{
     if(!e.deltaY)return;
     const max=Math.max(0,el.scrollHeight-el.clientHeight);
     if(max<=0)return;
     const next=Math.max(0,Math.min(max,el.scrollTop+e.deltaY));
     if(next!==el.scrollTop){e.preventDefault();e.stopPropagation();el.scrollTop=next;}
   },{passive:false});
 });
}

function renderCalendar(y,m){const names=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div class="cal-cell muted-day"></div>';for(let day=1;day<=days;day++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const ev=state.events.filter(e=>e.date===ds);const today=new Date();const is=day===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();cells+=`<button class="cal-cell ${is?'today':''}" onclick="addCalendarEvent('${ds}')"><b>${day}</b>${ev.map(e=>`<span class="cal-event">${esc(e.title)}</span>`).join('')}</button>`}appPage('📅 Calendário',`<div class="calendar-head"><button onclick="renderCalendar(${m===0?y-1:y},${m===0?11:m-1})">‹</button><h2>${new Date(y,m).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button onclick="renderCalendar(${m===11?y+1:y},${m===11?0:m+1})">›</button></div><div class="calendar-grid">${names.map(x=>`<div class="cal-cell"><b>${x}</b></div>`).join('')}${cells}</div><p class="muted">Clique em um dia para criar um evento.</p>`)}

function tt(a){const i=document.getElementById('ttIn'),o=document.getElementById('ttOut');if(!i||!o)return;let t=i.value;if(a==='upper')o.value=t.toUpperCase();if(a==='lower')o.value=t.toLowerCase();if(a==='trim')o.value=t.split(/\r?\n/).map(x=>x.trim()).join('\n');if(a==='sort')o.value=t.split(/\r?\n/).sort((x,y)=>x.localeCompare(y,'pt-BR')).join('\n');if(a==='dedupe')o.value=[...new Set(t.split(/\r?\n/))].join('\n');if(a==='reverse')o.value=t.split(/\r?\n/).reverse().join('\n');if(a==='count')showToast(`${(t.trim().match(/\S+/g)||[]).length} palavras • ${t?t.split(/\r?\n/).length:0} linhas`);if(a==='copy')navigator.clipboard?.writeText(o.value||t).then(()=>showToast('Copiado')).catch(()=>{});if(a==='download'){const b=new Blob([o.value||t],{type:'text/plain'}),ael=document.createElement('a');ael.href=URL.createObjectURL(b);ael.download='texto-tfos.txt';ael.click();URL.revokeObjectURL(ael.href)}}

let paintCtx,paintDown=false;function paintInit(){const c=document.getElementById('paintCanvas');if(!c)return;paintCtx=c.getContext('2d');paintCtx.fillStyle='#fff';paintCtx.fillRect(0,0,c.width,c.height);const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.onpointerdown=e=>{paintDown=true;paintCtx.beginPath();const p=pos(e);paintCtx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!paintDown)return;const p=pos(e);paintCtx.lineWidth=+document.getElementById('paintSize').value;paintCtx.strokeStyle=document.getElementById('paintColor').value;paintCtx.lineTo(p.x,p.y);paintCtx.stroke()};c.onpointerup=()=>paintDown=false;c.onpointerleave=()=>paintDown=false}function paintClear(){if(paintCtx){paintCtx.fillStyle='#fff';paintCtx.fillRect(0,0,900,520)}}function paintDownload(){const c=document.getElementById('paintCanvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='desenho-tfos.png';a.click()}

const TFOS_FILE_DB='TFOS_FILE_V2',TFOS_FILE_STORE='files';
function tfosOpenFileDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB não está disponível neste navegador.'));return}const req=indexedDB.open(TFOS_FILE_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(TFOS_FILE_STORE))req.result.createObjectStore(TFOS_FILE_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Não foi possível abrir o armazenamento local.'))})}
async function tfosPutBlob(id,blob,name,type){const db=await tfosOpenFileDB();return new Promise((resolve,reject)=>{const tx=db.transaction(TFOS_FILE_STORE,'readwrite');tx.objectStore(TFOS_FILE_STORE).put({id,blob,name,type,storedAt:new Date().toISOString()});tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{db.close();reject(tx.error||new Error('Falha ao guardar arquivo.'))}})}
async function tfosGetBlob(id){const db=await tfosOpenFileDB();return new Promise((resolve,reject)=>{const req=db.transaction(TFOS_FILE_STORE,'readonly').objectStore(TFOS_FILE_STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error)}})}
async function tfosDeleteBlob(id){const db=await tfosOpenFileDB();return new Promise((resolve,reject)=>{const tx=db.transaction(TFOS_FILE_STORE,'readwrite');tx.objectStore(TFOS_FILE_STORE).delete(id);tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{db.close();reject(tx.error)}})}
function tfosFileId(){return 'tfosfile-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
function tfosIndexFile(meta){state.files=Array.isArray(state.files)?state.files:[];state.storageBuckets=state.storageBuckets||{TFOS32:{apps:{},files:[]},TFOS64:{apps:{},files:[]}};const arch=String(meta.architecture||'TFOS32').toUpperCase()==='TFOS64'?'TFOS64':'TFOS32';const entry={id:meta.id||tfosFileId(),name:String(meta.name||'arquivo'),size:Number(meta.size||0),type:String(meta.type||'application/octet-stream'),architecture:arch,source:String(meta.source||'TFOS'),storedAt:meta.storedAt||new Date().toISOString(),storage:'IndexedDB'};const i=state.files.findIndex(f=>f.id===entry.id);if(i>=0)state.files[i]=entry;else state.files.push(entry);const b=state.storageBuckets[arch]||(state.storageBuckets[arch]={apps:{},files:[]});b.files=Array.isArray(b.files)?b.files:[];b.files=b.files.filter(f=>f.id!==entry.id);b.files.push({id:entry.id,name:entry.name,size:entry.size,type:entry.type,source:entry.source});return entry}
async function tfosStoreBlob(blob,meta){if(!(blob instanceof Blob))blob=new Blob([blob??''],{type:meta?.type||'text/plain;charset=utf-8'});const id=meta?.id||tfosFileId();await tfosPutBlob(id,blob,meta?.name||'arquivo',meta?.type||blob.type||'application/octet-stream');const entry=tfosIndexFile({...meta,id,size:blob.size,type:meta?.type||blob.type});if(meta?.alsoDownload){state.downloads=Array.isArray(state.downloads)?state.downloads:[];state.downloads.push({id,name:entry.name,detail:meta.detail||entry.source,size:entry.size,type:entry.type,architecture:entry.architecture,storedAt:entry.storedAt});state.downloads=state.downloads.slice(-300)}save();return entry}
function openTFOSFileManager(filter='ALL'){return openExternalFileManager(filter)}
function openExternalFileManager(filter='ALL'){
 const bridge=window.TFOSManagerBridge;
 if(bridge && typeof bridge.open==='function'){
  try{return bridge.open({filter:filter||'ALL'});}catch(e){console.error('TFOS manager bridge error',e);showToast('O gerenciador externo retornou um erro.');}
 }
 openModal('📁 Gerenciador independente',`<p>O gerenciador duplicado foi removido desta cópia do TFOS Lab.</p><p class="muted">O gerenciador independente precisa ser conectado por meio do conector de arquivos para abrir a interface aqui. Nenhum arquivo salvo foi apagado.</p><div class="app-toolbar"><button class="primary" onclick="openPackageInstaller()">Selecionar um pacote .APP / .PATCH</button><button onclick="openStorageService()">Ver armazenamento TFOS32 / TFOS64</button></div>`);
}
async function tfosImportToManager(input){const f=input.files?.[0];if(!f)return;try{const arch=prompt('Salvar em qual área? Digite TFOS32 ou TFOS64.','TFOS32');if(!arch)return;const normalized=arch.toUpperCase()==='TFOS64'?'TFOS64':'TFOS32';const entry=await tfosStoreBlob(f,{name:f.name,type:f.type||'application/octet-stream',source:'Importado para o TFOS',architecture:normalized,alsoDownload:false});notify('Arquivo guardado no TFOS: '+entry.name);openTFOSFileManager(normalized)}catch(e){showToast('Falha ao armazenar o arquivo: '+e.message)}finally{input.value=''}}
async function tfosOpenStoredFile(id){try{const meta=state.files.find(f=>f.id===id);if(!meta)return;const rec=await tfosGetBlob(id);if(!rec){showToast('Conteúdo ausente no IndexedDB; o registro não contém os bytes do arquivo.');return}const blob=rec.blob,url=URL.createObjectURL(blob),name=meta.name,type=meta.type||blob.type||'';if(type.startsWith('text/')||/\.((txt)|(md)|(json)|(csv)|(xml)|(log)|(js)|(css)|(html))$/i.test(name)){const text=await blob.text();openModal('📄 '+esc(name),`<p class="muted">${esc(meta.architecture)} · ${tfosFormatBytes(meta.size)}</p><pre style="white-space:pre-wrap;overflow:auto">${esc(text.slice(0,250000))}</pre><div class="app-toolbar"><button onclick="tfosExportStoredFile('${id}')">Exportar arquivo</button></div>`);URL.revokeObjectURL(url);return}let media='';if(type.startsWith('image/'))media=`<img src="${url}" alt="${esc(name)}" style="max-width:100%;max-height:68vh;object-fit:contain">`;else if(type.startsWith('audio/'))media=`<audio src="${url}" controls style="width:100%"></audio>`;else if(type.startsWith('video/'))media=`<video src="${url}" controls style="width:100%;max-height:68vh"></video>`;else if(type==='application/pdf'||/\.pdf$/i.test(name))media=`<iframe src="${url}" style="width:100%;height:68vh;border:0"></iframe>`;else media=`<p>Não há visualizador dedicado para este formato.</p><p class="muted">${esc(name)} · ${tfosFormatBytes(meta.size)}</p>`;openModal('👁️ Visualizador — '+esc(name),`<div>${media}</div><div class="app-toolbar"><button onclick="tfosExportStoredFile('${id}')">Exportar para o computador</button><button onclick="openExternalFileManager()">Abrir gerenciador externo</button></div>`);window.__tfosObjectUrls=window.__tfosObjectUrls||[];window.__tfosObjectUrls.push(url)}catch(e){showToast('Não foi possível abrir o arquivo: '+e.message)}}
async function tfosExportStoredFile(id){try{const rec=await tfosGetBlob(id),meta=state.files.find(f=>f.id===id);if(!rec||!meta){showToast('Arquivo não encontrado.');return}const url=URL.createObjectURL(rec.blob),a=document.createElement('a');a.href=url;a.download=meta.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);showToast('Exportação solicitada pelo usuário.')}catch(e){showToast('Falha na exportação: '+e.message)}}
async function tfosRemoveStoredFile(id){const meta=state.files.find(f=>f.id===id);if(!meta||!confirm('Excluir permanentemente '+meta.name+' do armazenamento TFOS?'))return;try{await tfosDeleteBlob(id)}catch(e){console.warn(e)}state.files=state.files.filter(f=>f.id!==id);state.downloads=(state.downloads||[]).filter(d=>d.id!==id);for(const arch of ['TFOS32','TFOS64']){const b=state.storageBuckets?.[arch];if(b?.files)b.files=b.files.filter(f=>f.id!==id)}save();openTFOSFileManager()}
async function tfosMigrateLegacyDownloads(){let changed=false;for(const d of (state.downloads||[])){if(d.id&&(!d.dataUrl&&!d.content))continue;try{const id=d.id||tfosFileId();let blob;if(d.dataUrl){const r=await fetch(d.dataUrl);blob=await r.blob()}else blob=new Blob([d.content||''],{type:d.type||'text/plain;charset=utf-8'});await tfosPutBlob(id,blob,d.name,d.type);const e=tfosIndexFile({id,name:d.name,size:blob.size,type:d.type,source:d.detail||'Downloads TFOS',architecture:d.architecture||'TFOS32'});d.id=id;d.size=blob.size;d.architecture=e.architecture;delete d.dataUrl;delete d.content;changed=true}catch(e){console.warn('Migração de download adiada:',e)}}if(changed)save()}

function openDownloads(){const ds=Array.isArray(state.downloads)?state.downloads:[];openModal('📥 Downloads TFOS',`<div class="three-grid"><div class="kpi">Arquivos<b>${ds.length}</b></div><div class="kpi">Índice de arquivos TFOS<b>${(state.files||[]).length}</b></div><div class="kpi">Destino<b>TFOS</b></div></div><div class="panel"><div class="row"><button class="primary" onclick="downloadTextFromTFOS()">＋ Criar TXT no TFOS</button><label class="btn" style="cursor:pointer">＋ Importar para TFOS<input type="file" hidden onchange="importDownloadFile(this)"></label><button onclick="openExternalFileManager()">Gerenciador externo</button></div><p class="muted">Arquivos importados ou criados ficam no armazenamento interno TFOS. Eles só são enviados ao computador quando você escolher Exportar.</p></div><div class="list">${ds.length?ds.map((d,i)=>`<div class="download-item"><div><b>${esc(d.name)}</b><br><small>${esc(d.detail||'Arquivo TFOS')} · ${tfosFormatBytes(d.size||0)} · ${esc(d.architecture||'TFOS32')}</small></div><div class="row"><button onclick="tfosOpenStoredFile('${d.id||''}')">Abrir</button><button onclick="tfosExportStoredFile('${d.id||''}')">Exportar</button><button class="danger" onclick="removeDownload(${i})">Excluir</button></div></div>`).join(''):'<div class="empty-state">Nenhum arquivo no TFOS. Importe um arquivo ou crie um TXT.</div>'}</div>`)}
async function downloadTextFromTFOS(){const t=prompt('Conteúdo do arquivo:');if(t===null)return;try{const b=new Blob([t],{type:'text/plain;charset=utf-8'});const f=await tfosStoreBlob(b,{name:'tfos-'+Date.now()+'.txt',detail:'Arquivo de texto criado no TFOS',source:'Downloads TFOS',type:b.type,architecture:'TFOS32',alsoDownload:true});notify('Arquivo armazenado no TFOS: '+f.name);openDownloads()}catch(e){showToast('Não foi possível guardar o arquivo: '+e.message)}}
async function importDownloadFile(input){const f=input.files?.[0];if(!f)return;try{const arch=prompt('Guardar em qual área? Digite TFOS32 ou TFOS64.','TFOS32');if(!arch)return;const e=await tfosStoreBlob(f,{name:f.name,detail:'Importado para Downloads TFOS',source:'Downloads TFOS',type:f.type||'application/octet-stream',architecture:arch.toUpperCase()==='TFOS64'?'TFOS64':'TFOS32',alsoDownload:true});notify('Arquivo guardado no TFOS: '+e.name);openDownloads()}catch(e){showToast('Não foi possível guardar: '+e.message)}finally{input.value=''}}
async function downloadEntry(i){const d=state.downloads?.[i];if(!d)return;await tfosExportStoredFile(d.id)}async function removeDownload(i){const d=state.downloads?.[i];if(!d)return;if(!confirm('Excluir este arquivo do TFOS?'))return;if(d.id)return tfosRemoveStoredFile(d.id);state.downloads.splice(i,1);save();openDownloads()}

function tfosBackup(){const b=new Blob([JSON.stringify({format:'TFOS-BACKUP',createdAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tfos-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);notify('Backup exportado')}
function tfosRestore(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.state){state=Object.assign(state,x.state);save();notify('Backup restaurado');renderDesktop()}else showToast('Backup TFOS inválido')}catch(e){showToast('Arquivo de backup inválido')}};r.readAsText(f)}

function openConnectorsForCurrentApp(){const source=window.__tfosCurrentWindow||'Aplicativo não identificado';openConnectorHub(source)}
function openConnectorHub(sourceApp){
 const apps=tfosAppRegistry().filter(a=>!a.system);
 const current=sourceApp||window.__tfosCurrentWindow||'Aplicativo';
 const plugins=Array.isArray(state.plugins)?state.plugins:[],conns=Array.isArray(state.connections)?state.connections:[];
 const options=apps.map(a=>`<option value="${esc(a.name)}" ${a.name===current?'selected':''}>${esc(a.name)}</option>`).join('');
 openModal('🔗 TFOS Connector Hub',`<p class="muted">Cada app tem um ponto de conexão. Um plugin declara capacidades; a conexão registra qual app pode solicitar essas capacidades. Nesta fase os registros são reais, mas plugins importados ainda não executam código.</p><div class="panel"><label>Aplicativo de destino</label><select id="connectorAppTarget" style="width:100%">${options}<option value="${esc(current)}" ${apps.some(a=>a.name===current)?'':'selected'}>${esc(current)}</option></select><label style="display:block;margin-top:10px">Plugin</label><select id="connectorPluginTarget" style="width:100%">${plugins.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.id)})</option>`).join('')||'<option value="">Nenhum plugin registrado</option>'}</select><button class="primary" style="margin-top:10px" onclick="connectPluginToApp()" ${plugins.length?'':'disabled'}>＋ Conectar plugin ao app</button><p class="muted">Exemplo: Calculadora → conversor de métricas; Calculadora → resolutor de equações do 1º/2º grau.</p></div><h3>Conexões registradas</h3><div class="list">${conns.length?conns.map((c,i)=>`<div class="item split"><span><b>${esc(c.appName)}</b><small class="muted">${esc((plugins.find(p=>p.id===c.pluginId)||{}).name||c.pluginId)} · ${c.enabled?'conectado':'desconectado'}</small></span><div class="row"><button onclick="togglePluginConnection(${i})">${c.enabled?'Desconectar':'Conectar'}</button><button class="danger" onclick="removePluginConnection(${i})">Remover</button></div></div>`).join(''):'<div class="empty-state">Ainda não há conexões. Registre um .plugin e associe-o a um app.</div>'}</div><h3>Serviços disponíveis</h3><div class="tool-grid2"><button onclick="openPackageInstaller()">📦 Instalador</button><button onclick="openExternalFileManager()">📁 Gerenciador externo</button><button onclick="openSystemServices()">⚙️ Serviços</button><button onclick="openSystemDiagnostics()">🩺 Diagnóstico</button></div>`);
}
function connectPluginToApp(){const app=document.getElementById('connectorAppTarget')?.value,pid=document.getElementById('connectorPluginTarget')?.value;if(!app||!pid){showToast('Selecione app e plugin.');return}state.connections=Array.isArray(state.connections)?state.connections:[];const old=state.connections.find(c=>c.appName===app&&c.pluginId===pid);if(old)old.enabled=true;else state.connections.push({appName:app,pluginId:pid,enabled:true,createdAt:new Date().toISOString()});save();notify('Conexão registrada: '+app+' ↔ '+pid);openConnectorHub(app)}
function togglePluginConnection(i){const c=state.connections?.[i];if(!c)return;c.enabled=!c.enabled;save();openConnectorHub(c.appName)}
function removePluginConnection(i){if(!state.connections?.[i])return;if(!confirm('Remover esta conexão?'))return;state.connections.splice(i,1);save();openConnectorHub()}

function openStorageService(){
 const b=state.storageBuckets||{},a=b.TFOS32||{apps:{},files:[]},c=b.TFOS64||{apps:{},files:[]};
 const size=x=>{try{return new Blob([JSON.stringify(x||{})]).size}catch(e){return 0}};
 openModal('💽 Serviço de Armazenamento',`<p class="muted">TFOS32 e TFOS64 são áreas lógicas no armazenamento do TFOS. Esta cópia guarda arquivos localmente via IndexedDB quando disponível. O uso real da cota Supabase não pode ser mostrado sem conectar e consultar o bucket remoto.</p><div class="two"><div class="card"><h3>TFOS32</h3><p>Apps leves e dados compactos.</p><div class="big">${tfosFormatBytes(size(a))}</div><small>${(a.files||[]).length} itens no índice</small></div><div class="card"><h3>TFOS64</h3><p>Apps de maior consumo, mídia e dados avançados.</p><div class="big">${tfosFormatBytes(size(c))}</div><small>${(c.files||[]).length} itens no índice</small></div></div><div class="settings-row"><b>Dados serializados em localStorage</b><span>${tfosFormatBytes(tfosStorageInfo().used)}</span></div><div class="settings-row"><b>Referência informada de cota Supabase</b><span>500 MB — uso remoto desconhecido</span></div><div class="settings-row"><b>Estado da conexão Supabase</b><span>${esc(tfosSupabaseStatus())}</span></div><p class="muted">O tamanho do HTML hospedeiro não é somado artificialmente ao índice local. Ele só entra na cota Supabase se estiver armazenado no serviço que contabiliza essa cota.</p><button class="primary" onclick="openExternalFileManager()">Conectar gerenciador independente</button>`);

async function importPluginFile(input){
 const f=input.files?.[0]; if(!f)return;
 try{
  if(f.size>2*1024*1024)throw new Error('O manifesto ultrapassa 2 MB.');
  let obj;try{obj=JSON.parse(await f.text())}catch(e){throw new Error('O .plugin precisa conter um manifesto JSON legível nesta versão.')}
  const m=obj.manifest||obj;
  if(String(obj.format||'').toUpperCase()!=='TFOS-PLUGIN' && String(obj.type||m.type||'').toUpperCase()!=='PLUGIN')throw new Error('Formato não reconhecido. Esperado format: TFOS-PLUGIN.');
  const id=String(m.id||obj.id||'').trim(),name=String(m.name||obj.name||f.name.replace(/\.plugin$/i,'')).trim();
  if(!id||!name)throw new Error('O manifesto precisa de id e name.');
  const entry={id,name,version:String(m.version||obj.version||'1.0.0'),description:String(m.description||obj.description||''),target:String(m.target||obj.target||''),capabilities:Array.isArray(m.capabilities)?m.capabilities:[],status:'manifesto registrado; conector ainda precisa ser associado',fileName:f.name,registeredAt:new Date().toISOString()};
  state.plugins=Array.isArray(state.plugins)?state.plugins:[];const idx=state.plugins.findIndex(x=>x.id===id);if(idx>=0)state.plugins[idx]=entry;else state.plugins.push(entry);
  save();notify('.PLUGIN registrado. Nenhum código foi executado.');openPluginManager();
 }catch(e){showToast('Plugin recusado: '+e.message)}finally{input.value=''}
}

    'TFOS Store':'store','Personalização':'personalization','Calculadora':'calculator','Calendário':'calendar','Relógio':'clock','Bloco de Notas':'notes','Ferramentas de Texto':'texttools','Galeria':'gallery','Ícones & Paint':'paint','Gravador':'recorder','Downloads & Compartilhamento':'downloads','Editor de Código':'code','TFOS Lab':'lab','TFOS Dev':'dev',

function renderLauncherMenu(){
  const apps=launcherEntries();
  const q=(document.getElementById('launcherMenuSearch')?.value||'').trim().toLocaleLowerCase('pt-BR');
  const list=q?apps.filter(a=>(a.name+' '+a.id).toLocaleLowerCase('pt-BR').includes(q)):apps;
  const grid=document.getElementById('launcherMenuGrid');
  if(grid)grid.innerHTML=list.map(a=>`<div class="launcherMenuCard" data-app="${esc(a.id)}" onclick="openLauncherItem('${esc(a.id)}')"><span class="mi">${a.icon}</span><b title="${esc(a.name)}">${esc(a.name)}</b><button class="launcherAppMore" aria-label="Mais opções" title="Mais opções" onclick="event.stopPropagation();openLauncherContext(event,'${esc(a.id)}')">⋯</button></div>`).join('')||'<div class="launcherMenuHint" style="padding:12px">Nenhum aplicativo encontrado.</div>';
  const count=document.getElementById('launcherMenuCount');if(count)count.textContent=list.length+' apps';
}
function filterLauncherMenu(q){renderLauncherMenu();}
function openNativeMenu(){const m=document.getElementById('tfosNativeMenu');if(!m)return;m.classList.add('open');m.setAttribute('aria-hidden','false');renderLauncherMenu();setTimeout(()=>document.getElementById('launcherMenuSearch')?.focus(),0);}
function toggleNativeMenu(ev){if(ev){ev.preventDefault();ev.stopPropagation();}const m=document.getElementById('tfosNativeMenu');if(!m)return;m.classList.contains('open')?closeNativeMenu():openNativeMenu();}
function closeNativeMenu(){const m=document.getElementById('tfosNativeMenu');if(m){m.classList.remove('open');m.setAttribute('aria-hidden','true');}closeLauncherContext();}
function openNativeMenuApp(type){openLauncherItem(type);}
function closeLauncherContext(){const c=document.getElementById('launcherContext');if(c){c.hidden=true;c.innerHTML='';}}
function launcherAction(id,action){
  const m=tfLauncherMeta(id),name=m[1];
  closeLauncherContext();
  if(action==='open'){openLauncherItem(id);return}
  if(action==='dock'){toggleDockItem(id);return}
  if(action==='desktop'){toggleDesktopItem(id);return}
  if(action==='rename'){const n=prompt('Novo nome do aplicativo:',name);if(n&&n.trim()){showToast('Nome personalizado preparado para '+n.trim()+' — será formalizado em Configurações.')}return}
  if(action==='icon'){const n=prompt('Novo ícone (emoji):',m[0]);if(n&&n.trim()){showToast('Ícone personalizado preparado — será formalizado em Configurações.')}return}
  if(action==='properties'){openModal('Propriedades — '+esc(name),`<div class="launcherProperties"><div class="prop"><span>Aplicativo</span><b>${esc(name)}</b></div><div class="prop"><span>ID</span><b>${esc(id)}</b></div><div class="prop"><span>Local</span><b>TFOS / Aplicativos nativos</b></div><div class="prop"><span>Tipo</span><b>Aplicativo TFOS</b></div></div>`);return}
  if(action==='permissions'){openModal('Permissões — '+esc(name),`<p class="muted">As permissões deste aplicativo serão administradas em Configurações.</p><div class="list"><div class="item split"><span>Arquivos</span><b>Definido pelo sistema</b></div><div class="item split"><span>Internet</span><b>Definido pelo sistema</b></div><div class="item split"><span>Dispositivos</span><b>Definido pelo sistema</b></div></div>`);return}
  if(action==='uninstall'){showToast('Desinstalação será formalizada em Configurações.');return}
}
function openLauncherContext(ev,id){
  const c=document.getElementById('launcherContext');if(!c)return;
  const m=tfLauncherMeta(id),name=m[1],dock=state.launcherDock?.includes(id),desk=state.desktopItems?.includes(id);
  c.innerHTML=`<button onclick="launcherAction('${esc(id)}','open')">Abrir</button><button onclick="launcherAction('${esc(id)}','desktop')">${desk?'✓ Remover da tela inicial':'＋ Adicionar à tela inicial'}</button><button onclick="launcherAction('${esc(id)}','dock')">${dock?'✓ Remover da doca':'＋ Adicionar à doca'}</button><div class="ctx-sep"></div><button onclick="launcherAction('${esc(id)}','permissions')">🔐 Permissões do app</button><button onclick="launcherAction('${esc(id)}','properties')">ℹ Propriedades</button><button onclick="launcherAction('${esc(id)}','rename')">✎ Renomear</button><button onclick="launcherAction('${esc(id)}','icon')">◈ Editar ícone</button><div class="ctx-sep"></div><button class="ctx-danger" onclick="launcherAction('${esc(id)}','uninstall')">⌫ Desinstalar aplicativo</button>`;
  c.hidden=false;
  const r=ev.currentTarget?.getBoundingClientRect?.()||{right:ev.clientX,top:ev.clientY,bottom:ev.clientY};
  const w=220,h=300,x=Math.min(window.innerWidth-w-8,Math.max(8,r.right-w)),y=Math.min(window.innerHeight-h-8,Math.max(8,r.bottom+4));
  c.style.left=x+'px';c.style.top=y+'px';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLauncherContext();closeNativeMenu();}});
document.addEventListener('click',e=>{const m=document.getElementById('tfosNativeMenu'),b=document.getElementById('tfosNativeMenuBtn'),c=document.getElementById('launcherContext');if(c&&!c.hidden&&!c.contains(e.target)&&!e.target.closest('.launcherAppMore'))closeLauncherContext();if(m&&m.classList.contains('open')&&m.contains(e.target))return;if(m&&m.classList.contains('open')&&e.target!==b&&!b?.contains(e.target))closeNativeMenu();});

function openNativeMenuApp(type){openLauncherItem(type);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNativeMenu();});
document.addEventListener('click',e=>{const m=document.getElementById('tfosNativeMenu'),b=document.getElementById('tfosNativeMenuBtn');if(!m||!m.classList.contains('open'))return;if(m.contains(e.target)||b===e.target||b?.contains(e.target))return;closeNativeMenu();});

<script>
(function(){
  if(window.__tfosWMCore)return;
  window.__tfosWMCore=true;

  const originalOpenApp=window.openApp;
  const originalRenderDesktop=window.renderDesktop;
  const WM={wins:new Map(),z:40,active:null};

  function meta(id){return typeof tfLauncherMeta==='function'?tfLauncherMeta(id):['📦',id,id]}
  function iconFor(type){return meta(type)[0]}
  function titleFor(type){return meta(type)[1]}
  function ensureDock(){
    let d=document.getElementById('tfosDock');
    if(!d){d=document.createElement('div');d.id='tfosDock';d.className='tfosDock';document.body.appendChild(d)}
    return d;
  }
  function renderDockWM(){
    const d=ensureDock();
    const normalize=id=>typeof window.tfosNormalizeLauncherId==='function'?window.tfosNormalizeLauncherId(id):String(id);
    const pinned=(Array.isArray(state.launcherDock)?state.launcherDock:[]).map(normalize);
    const open=[...WM.wins.values()].filter(w=>!w.closed).map(w=>normalize(w.type));
    const ids=[...new Set([...pinned,...open])];
    d.style.display=ids.length?'flex':'none';
    d.innerHTML=ids.map(id=>{
      const m=meta(id), isOpen=open.includes(id);
      const pkg=String(id).startsWith('installed:')?(state.appPackages||[]).find(p=>String(p.id)===String(id).slice(10)):null;
      const icon=String(pkg?.iconData||pkg?.icon||pkg?.manifest?.icon||'');
      const safeImage=/^(data:image\/(png|jpeg|webp|gif);base64,|https?:\/\/)/i.test(icon);
      const visual=safeImage?`<img src="${esc(icon)}" alt="" style="width:30px;height:30px;object-fit:contain;border-radius:7px">`:`<span class="tfosDockGlyph">${m[0]}</span>`;
      return `<button class="tfosDockItem ${isOpen?'wm-open':''}" onclick="tfosWM.activate('${esc(id)}')" title="${esc(m[1])}">${visual}<small>${esc(m[1])}</small></button>`;
    }).join('');
  }
  function focus(w){
    if(!w||w.closed)return;
    WM.z++;w.el.style.zIndex=WM.z;WM.active=w.type;
    document.querySelectorAll('.tfosWMWindow').forEach(e=>e.classList.remove('wm-active'));
    w.el.classList.add('wm-active');renderDockWM();
  }
  function rect(w){
    const area=document.getElementById('main'),r=area.getBoundingClientRect();
    const maxW=Math.max(300,r.width-24),maxH=Math.max(190,r.height-55);
    w.w=Math.min(Math.max(300,w.w||Math.min(720,maxW)),maxW);
    w.h=Math.min(Math.max(190,w.h||Math.min(520,maxH)),maxH);
    w.x=Math.max(8,Math.min(w.x??Math.round((r.width-w.w)/2),r.width-w.w-8));
    w.y=Math.max(8,Math.min(w.y??Math.round((r.height-w.h)/2),r.height-w.h-8));
    Object.assign(w.el.style,{left:w.x+'px',top:w.y+'px',width:w.w+'px',height:w.h+'px'});
  }
  function drag(w,ev){
    if(ev.button!==0)return;
    ev.preventDefault();
    const sx=ev.clientX,sy=ev.clientY,ox=w.x,oy=w.y;
    const move=e=>{w.x=ox+e.clientX-sx;w.y=oy+e.clientY-sy;rect(w)};
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up)};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  }
  function resize(w,ev){
    ev.preventDefault();ev.stopPropagation();
    const sx=ev.clientX,sy=ev.clientY,ow=w.w,oh=w.h;
    const move=e=>{w.w=Math.max(300,ow+e.clientX-sx);w.h=Math.max(190,oh+e.clientY-sy);rect(w)};
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up)};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  }
  function create(type,title,html,temporary=false){
    const area=document.getElementById('main');
    let layer=document.getElementById('tfosWMLayer');if(!layer){layer=document.createElement('div');layer.id='tfosWMLayer';layer.className='tfosWMLayer';document.body.appendChild(layer)}
    const w={type,title,html,temporary,closed:false,minimized:false,fullscreen:false,w:Math.min(720,Math.max(300,area.clientWidth-30)),h:Math.min(520,Math.max(190,area.clientHeight-70)),x:20,y:20};
    const el=document.createElement('section');el.className='tfosWMWindow wm-active';
    const wmBodyClass=String(html).includes('settings-linux')?' settings-wm-body':'';
    el.innerHTML=`<div class="tfosWMBar"><span class="tfosWMIcon">${iconFor(type)}</span><span class="tfosWMTitle">${esc(title.replace(/^[^ ]+ /,''))}</span><div class="tfosWMBtns"><button class="tfosWMNav tfosWMBack" title="Voltar / área de trabalho">←</button><button class="tfosWMNav tfosWMConnect" title="Conectores deste app">🔗</button><button class="tfosWMBtn" title="Minimizar">—</button><button class="tfosWMBtn" title="Tela cheia">⛶</button><button class="tfosWMBtn tfosWMClose" title="Fechar">×</button></div></div><div class="tfosWMBody${wmBodyClass}">${html}</div><div class="tfosWMResize"></div>`;
    layer.appendChild(el);w.el=el;
    el.addEventListener('pointerdown',()=>focus(w));
    el.querySelector('.tfosWMBar').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;focus(w);drag(w,e)});
    el.querySelector('.tfosWMResize').addEventListener('pointerdown',e=>{focus(w);resize(w,e)});
    const btns=el.querySelectorAll('.tfosWMBtn');
    btns[0].onclick=e=>{e.stopPropagation();w.minimized=true;el.style.display='none';renderDockWM()};
    btns[1].onclick=e=>{e.stopPropagation();toggleFullscreen(w)};
    el.querySelector('.tfosWMClose').onclick=e=>{e.stopPropagation();close(w)};
    el.querySelector('.tfosWMBack').onclick=e=>{e.stopPropagation();if(w.navHistory&&w.navHistory.length){const prev=w.navHistory.pop();w.title=prev.title;w.el.querySelector('.tfosWMTitle').textContent=String(prev.title).replace(/^[^ ]+ /,'');w.el.querySelector('.tfosWMBody').innerHTML=prev.html;}else{w.minimized=true;el.style.display='none';renderDockWM()}};
    el.querySelector('.tfosWMConnect').onclick=e=>{e.stopPropagation();window.__tfosConnectorSource=w.type.startsWith('installed:')?(state.appPackages||[]).find(p=>p.id===w.type.slice(10))?.name||w.title:w.title;if(window.tfosWM)window.tfosWM.open('connector-hub');else openConnectorHub(window.__tfosConnectorSource)};
    WM.wins.set(type,w);rect(w);
    const installedProfile=type.startsWith('installed:')?(state.appPackages||[]).find(p=>p.id===type.slice(10)):null;
    const mode=installedProfile?.window?.mode||'resizable';
    if(mode==='fixed'){w.el.querySelector('.tfosWMResize').style.display='none';w.el.style.resize='none';w.w=Math.min(Number(installedProfile.window.preferredWidth)||720,Math.max(300,area.clientWidth-16));w.h=Math.min(Number(installedProfile.window.preferredHeight)||520,Math.max(190,area.clientHeight-55));rect(w)}
    focus(w);if(mode==='fullscreen')toggleFullscreen(w);return w;
  }
  function close(w){
    if(!w||w.closed)return;
    w.closed=true;w.el.remove();WM.wins.delete(w.type);if(WM.active===w.type)WM.active=null;renderDockWM();
  }
  function activate(type){
    const w=WM.wins.get(type);if(!w||w.closed){open(type);return;}
    if(w.minimized){w.minimized=false;w.el.style.display='flex';focus(w);return}
    if(WM.active===type){w.minimized=true;w.el.style.display='none';renderDockWM();return}
    focus(w);
  }
  function toggleFullscreen(w){
    if(w.fullscreen){
      w.fullscreen=false;Object.assign(w.el.style,{left:w.prev.x+'px',top:w.prev.y+'px',width:w.prev.w+'px',height:w.prev.h+'px'});
    }else{
      w.prev={x:w.x,y:w.y,w:w.w,h:w.h};w.fullscreen=true;
      Object.assign(w.el.style,{left:'4px',top:'4px',width:'calc(100% - 8px)',height:'calc(100% - 8px)'});
    }
    focus(w);
  }
  function capture(type,title){
    const modal=document.getElementById('modal');
    let html='';let capturedTitle=title;
    if(modal?.classList.contains('open')){
      capturedTitle=document.getElementById('winTitle')?.textContent||title;
      html=document.getElementById('winBody')?.innerHTML||'';
      if(typeof closeModal==='function')closeModal();
    }else{
      const main=document.getElementById('main');html=main.innerHTML;
    }
    if(!html.trim())return null;
    const w=create(type,capturedTitle,html,false);
    if(!modal?.classList.contains('open') && typeof originalRenderDesktop==='function')originalRenderDesktop();
    return w;
  }
  function open(type){
    const existing=WM.wins.get(type);
    if(existing&&!existing.closed){activate(type);return existing}
    const beforeMain=document.getElementById('main').innerHTML;
    const beforeModal=document.getElementById('modal')?.className||'';
    window.__tfosWMOpening=true;
    let w=null;
    try{
      const customRoutes={
        'files':()=>openTFOSFileManager(),
        'package-installer':()=>openPackageInstaller(),
        'package-validator':()=>openPackageInstaller(),
        'storage-service':()=>openStorageService(),
        'connector-hub':()=>openConnectorHub(window.__tfosConnectorSource||'Aplicativo'),
        'plugins':()=>openPluginManager(),
        'services':()=>openSystemServices(),
        'event-service':()=>openEventService(),
        'system-diagnostics':()=>openSystemDiagnostics(),
        'media-service':()=>openMediaPlayer(),
        'packages-app':()=>openAppPackages(),
        'packages-patch':()=>openPatches(),
        'packages-pack':()=>openPacks()
      };
      if(type.startsWith('installed:'))openInstalledApp(type.slice(10));
      else if(customRoutes[type])customRoutes[type]();
      else originalOpenApp(type);
      w=capture(type,titleFor(type));
    }finally{window.__tfosWMOpening=false}
    if(!w){
      document.getElementById('main').innerHTML=beforeMain;
      if(document.getElementById('modal'))document.getElementById('modal').className=beforeModal;
      return null;
    }
    renderDockWM();return w;
  }

  window.tfosWM=WM;

  window.openAppPackages=function(){const apps=safeArray('appPackages');openModal('📦 Gerenciador de .APP',`<p class="muted">Só pacotes com código de entrada reconhecido são disponibilizados no Launcher. Manifestos incompletos ficam registrados, mas não são apresentados como apps funcionais.</p><div class="app-toolbar"><button class="primary" onclick="openPackageInstaller()">Instalar .APP</button><button onclick="openExternalFileManager()">Gerenciador externo</button></div><div class="list">${apps.map(p=>`<div class="item split"><span><b>${esc(p.name)}</b><small class="muted">${esc(p.id)} · ${esc(p.version)} · ${esc(p.architecture)} · ${esc(p.status||'registrado')}</small></span><span class="row">${p.launchable?`<button onclick="openApp('installed:${esc(p.id)}')">Abrir</button>`:''}<button class="danger" onclick="tfosUninstallApp('${esc(p.id)}')">Desinstalar</button></span></div>`).join('')||'<div class="empty-state">Nenhum .APP registrado.</div>'}</div>`)};
